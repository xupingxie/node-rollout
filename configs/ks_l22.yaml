# Kuramoto-Sivashinsky L=22, N=64 training configuration.
# Periodic conv field (translation-equivariant); switch to kind: mlp,
# width: 512 for the MLP variant.
data:
  system: ks_l22
  T_train: 200.0
  T_val: 20.0
  n_test: 50
  T_test: 15.0
  T_long: 200.0
  tau_factor: 0.5
  ftle_method: svd
  gap_T: 5.0
  ftle_stride: 10         # svd FTLE on the 64-dim KS tangent is ~0.7 s per point
  lyap_T: 1000.0
  seed: 0
model:
  kind: conv
  width: 64          # channels
  depth: 5
  kernel: 5
  activation: silu
  dt_mult: 2          # model RK4 step 0.1 (= 2 x data dt); halves the unrolled chain
schedule:
  name: ss
  W: 0.5
  beta: 1.0
  beta_min_frac: 0.25
  warmup_frac: 0.10
  W_min_steps: 5
  W_max: 2.0
  bucketing: q4
  bucket_agg: min
  loss_norm: inv_W
  ramp_W0: 0.1
  K: 3
  mp_penalty: 1.0
  mu_floor_quantile: 0.0
train:
  n_steps: 30000        # maximum; early stopping normally ends sooner
  batch_size: 96        # run KS at 2 procs/GPU and no unroll beyond 1 T_lambda (--lean list); 2 T_lambda unrolls at 3/GPU OOM
  lr: 0.001
  lr_min: 0.00001
  lr_schedule: plateau     # halve lr after plateau_patience stalled validations
  plateau_factor: 0.5
  plateau_patience: 4         # validations -> lr halves after 1000 stalled steps
  weight_decay: 0.00001
  grad_clip: null
  log_every: 10
  progress_every: 50
  val_every: 250
  segment_log_every: 500
  segment_log_n: 8
  ckpt_every: 1000
  device: auto
  early_stop_metric: loss_val_halfT
  early_stop_patience: 12     # validations -> stop after 3000 stalled steps (and >= min_steps); spans 3 lr cuts
  early_stop_min_delta: 0.01
  min_steps: 8000
  resume: true
eval:
  valid_thresholds: [0.3, 0.5]
  n_long_rollouts: 3
  lyap_T: 100.0
  psd_nperseg: 1024
  mmd_n: 2000
